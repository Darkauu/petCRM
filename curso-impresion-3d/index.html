      data-title-lines: cortes de línea deliberados para el título voxel

      data-steps: pasos de construcción de este punto.
    -->

        <p class="micro eyebrow">Sección 01 / Fundamentos</p>
        <h1 class="voxel-title"><span class="line">¿Qué es la</span> <span class="line">impresión 3D?</span></h1>
      </div>

      <h2 class="subtitle">
        <span class="micro">Punto 01</span>

            <p class="micro index">B /</p>
            <h3>Sustractiva</h3>
            <p class="body">Se parte de un bloque sólido y se retira material hasta que aparece la pieza.</p>
